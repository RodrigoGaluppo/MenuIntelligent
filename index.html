<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ORZA — Fire Grill Menu</title>
  <meta name="description" content="Fictional video-first restaurant menu mockup." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div>
      <p class="logo">ORZA</p>
      <p class="tag" id="tagline"></p>
    </div>
    <div class="langs" id="langs"></div>
  </header>

  <div class="toolbar">
    <input id="search" type="search" autocomplete="off" />
    <div id="google_translate_element"></div>
  </div>

  <section class="hero" id="hero"></section>

  <nav class="cats" id="cats"></nav>
  <main class="grid" id="grid"></main>
  <footer class="foot" id="foot"></footer>
  <div id="reel" class="reel hidden"></div>

  <script src="menu.js"></script>
  <script src="app.js"></script>
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: "pl",
        includedLanguages: "pl,en,uk",
        autoDisplay: false
      }, "google_translate_element");
    }
  </script>
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
